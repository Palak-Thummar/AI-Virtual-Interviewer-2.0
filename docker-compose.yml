# ==============================================================
# CareerIQ – Docker Compose
# Runs backend, frontend, and MongoDB together.
#
# Usage:
#   cp backend/.env.example backend/.env   # fill in values
#   docker-compose up --build
# ==============================================================

version: "3.9"

services:

  # ── MongoDB ───────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: careeriq-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ai_interviewer
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI) ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careeriq-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB: ai_interviewer
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  # ── Frontend (Nginx) ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_SERVER_URL: http://localhost:8000
    container_name: careeriq-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
    driver: local
